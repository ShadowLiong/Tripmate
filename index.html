</style><main><header class="top"><div class="brand">✦ Tripmate</div><div><button class="btn" id="export">导出</button><button class="btn" id="import">导入</button><input type="file" id="file" accept=".json" hidden><button class="btn primary" id="new">＋ 新建行程</button></div></header><section class="hero"><div><div class="muted">下一段旅程</div><h1 id="name"></h1><div id="dates" class="muted"></div></div><select id="trips"></select></section><section class="stats"><div class="card"><div class="muted">账单 <small>Expenses</small></div><div class="stat" id="total"></div><div class="foot">按已保存汇率折算</div></div><div class="card"><div class="muted">已计划事项</div><div class="stat" id="count"></div><div class="foot">行程安排数</div></div><div class="card"><div class="muted">出行人数</div><div class="stat" id="pcount"></div><div id="names" class="foot"></div></div></section><div class="cols"><section class="main"><nav class="tabs"><button class="tab active" data-tab="itinerary">行程 <small>Itinerary</small></button><button class="tab" data-tab="expenses">账单 <small>Expenses</small></button><button class="tab" data-tab="summary">结算 <small>Settlement</small></button></nav><div class="panel" id="panel"></div></section><aside class="side"><h3>一览</h3><div class="muted">每位成员的当前余额</div><button type="button" class="btn" data-act="addMember">＋ 添加成员</button><div id="balances"></div><h3>建议结算</h3><div id="settlements"></div><div class="rate"><label>汇率 <small>Exchange Rate</small> · 1 RMB = MYR</label><br><input type="number" id="rate" min=".0001" step=".0001"><button class="btn" id="saveRate">保存</button></div></aside></div><p class="foot">行程数据保存在此浏览器中。导出备份即可在其他设备上恢复。</p></main><div id="toast" class="toast"></div><dialog id="dlg"><form id="form"></form></dialog><script>
(()=>{const K="tripmate-v1",q=s=>document.querySelector(s),qa=s=>Array.from(document.querySelectorAll(s)),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),uid=()=>Math.random().toString(36).slice(2,10);const CURRENCIES={MYR:{label:"MYR",prefix:"RM ",decimals:2,needsRate:false},RMB:{label:"RMB",prefix:"RMB ",decimals:2,needsRate:true},SGD:{label:"SGD",prefix:"SGD ",decimals:2,needsRate:true},JPY:{label:"JPY",prefix:"JPY ",decimals:0,needsRate:true},THB:{label:"THB",prefix:"THB ",decimals:2,needsRate:true},USD:{label:"USD",prefix:"USD ",decimals:2,needsRate:true}};function currencyInfo(c){return CURRENCIES[c]||CURRENCIES.RMB}function seed(){return{active:"gz",trips:[{id:"gz",name:"Guangzhou Trip 2026",start:"2026-10-25",end:"2026-10-31",people:["A","B","C","D","E"],rate:.65,events:[],expenses:[]}]}}function localISODate(v){let y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,"0"),d=String(v.getDate()).padStart(2,"0");return y+"-"+m+"-"+d}function todayISO(){return localISODate(new Date())}function load(){
  let raw = localStorage.getItem(K), x;
  if (raw === null) {
    x = seed();

  try {
    x = JSON.parse(raw);
  } catch (e) {
    x = seed();
    localStorage.setItem(K, JSON.stringify(x));
    return x;
  }
  if (!x || !Array.isArray(x.trips) || !x.trips.length) return x;
  let changed = false;

    trip.expenses.forEach(e => {

        if (!e.date) {
          let stamp = e.created ? new Date(e.created) : null;
          e.date = stamp && !isNaN(stamp.getTime())
            ? localISODate(stamp)

        }

        }

}let db=load(),tab="itinerary",t=()=>db.trips.find(x=>x.id===db.active)||db.trips[0];function personName(id,x){return x.personNames&&x.personNames[id]||id}function save(){localStorage.setItem(K,JSON.stringify(db));render()}function d(s,o){return new Intl.DateTimeFormat("zh-CN",Object.assign({timeZone:"UTC"},o)).format(new Date(s+"T12:00:00Z"))}function cash(n,c){let cfg=currencyInfo(c);return cfg.prefix+Number(n||0).toFixed(cfg.decimals)}function cv(n,c,exchangeRate){let amount=Number(n||0),cfg=currencyInfo(c);if(!cfg.needsRate)return amount;let rate=Number(exchangeRate);if(!(rate>0)&&c==="RMB")rate=Number(t().rate);return amount*(rate>0?rate:0)}function fmt(n){return"RM "+Number(n).toFixed(2)}

function render(){let x=t(),b=balances(),ss=settles();q("#name").textContent=x.name;q("#dates").textContent=d(x.start,{day:"numeric",month:"long"})+" – "+d(x.end,{day:"numeric",month:"long",year:"numeric"});q("#trips").innerHTML=db.trips.map(a=>'<option value="'+esc(a.id)+'" '+(a.id===x.id?"selected":"")+'>'+esc(a.name)+'</option>').join("");q("#total").textContent=cash(x.expenses.reduce((z,e)=>z+cv(e.amount,e.currency,e.exchangeRate),0),"MYR");q("#count").textContent=x.events.length;q("#pcount").textContent=x.people.length;q("#names").textContent=x.people.map(p=>personName(p,x)).join(" · ");q("#rate").value=x.rate;q("#balances").innerHTML=x.people.map(p=>'<div class="person"><span class="badge">'+esc(personName(p,x).charAt(0).toUpperCase())+'</span><span class="info">'+esc(personName(p,x))+'</span><button type="button" class="editname" title="编辑姓名" aria-label="编辑姓名" data-act="editPerson" data-id="'+esc(p)+'">编辑</button><button type="button" class="editname deletemember" title="删除成员" aria-label="删除成员" data-act="deleteMember" data-id="'+esc(p)+'">删除</button><span class="balance '+(b[p].balance>=0?"pos":"neg")+'">'+(b[p].balance>=0?"+":"−")+fmt(Math.abs(b[p].balance))+'</span></div>').join("");q("#settlements").innerHTML=ss.length?ss.map(z=>'<div class="settle"><b>'+esc(personName(z.a,x))+'</b> 应付给 <b>'+esc(personName(z.b,x))+'</b><br>'+fmt(z.n)+'</div>').join(""):'<div class="foot">已全部结清 ✨</div>';renderPanel();qa(".tab").forEach(z=>z.classList.toggle("active",z.dataset.tab===tab))}
function renderPanel(){let x=t(),p=q("#panel");if(tab==="itinerary"){let a=x.events.slice().sort((m,n)=>(m.date+m.time).localeCompare(n.date+n.time));p.innerHTML='<div class="head"><div><h2>行程安排 <small>Itinerary</small></h2><p class="muted">所有安排，一目了然</p></div><button class="btn primary" data-act="addEvent">＋ 添加安排</button></div>'+(a.length?'<div class="list">'+a.map(e=>'<div class="row"><div class="date">'+d(e.date,{month:"short"})+'<br>'+d(e.date,{day:"numeric"})+'</div><div class="info"><div class="title">'+esc(e.title)+'</div><div class="sub">'+esc(e.location)+(e.notes?" · "+esc(e.notes):"")+'</div></div><span class="hide-sm">'+esc(e.time)+'</span><button data-act="editEvent" data-id="'+e.id+'">✎</button><button data-act="delEvent" data-id="'+e.id+'">×</button></div>').join("")+'</div>':'<div class="empty">🗺️<b>开启一段新旅程</b>添加一项安排，开始规划行程。</div>')}else if(tab==="expenses"){p.innerHTML='<div class="head"><div><h2>账单 <small>Expenses</small></h2><p class="muted">快速记录共同开销</p></div><button class="btn primary" data-act="addExpense">＋ 添加账单</button></div>'+(x.expenses.length?'<div class="list">'+x.expenses.slice().sort((a,b)=>b.created-a.created).map(e=>'<div class="row">🧾<div class="info"><div class="title">'+esc(e.name)+'</div><div class="sub">付款人：'+esc(personName(e.payer,x))+' · '+e.participants.length+' 人分摊 · '+d(e.date,{month:"short",day:"numeric"})+(currencyInfo(e.currency).needsRate?" · 汇率 1 "+currencyInfo(e.currency).label+" = RM "+Number(e.exchangeRate||(e.currency==="RMB"?x.rate:0)).toFixed(4):"")+'</div></div><b>'+cash(e.amount,e.currency)+'</b><button type="button" title="编辑账单" aria-label="编辑账单" data-act="editExpense" data-id="'+e.id+'">✎</button><button data-act="delExpense" data-id="'+e.id+'">×</button></div>').join("")+'</div>':'<div class="empty">☕<b>一起记账更轻松</b>添加账单，自动公平分摊。</div>')}else{let b=balances(),s=settles();p.innerHTML='<h2>余额与结算 <small>Settlement</small></h2><p class="muted">按已保存汇率折算为 MYR</p><div class="list">'+x.people.map(a=>'<div class="row"><span function eventForm(old){let x=t(),e=old||{};modal(old?"编辑安排":"添加行程安排",'<div class="field wide"><label>标题</label><input name="title" required value="'+esc(e.title)+'"></div><div class="field"><label>日期</label><input name="date" type="date" required value="'+(e.date||x.start)+'"></div><div class="field"><label>时间</label><input name="time" type="time" value="'+(e.time||"")+'"></div><div class="field wide"><label>地点</label><input name="location" value="'+esc(e.location)+'"></div><div class="field wide"><label>备注</label><textarea name="notes">'+esc(e.notes)+'</textarea></div>',z=>{let a=Object.fromEntries(z);if(old)Object.assign(old,a);else x.events.push(Object.assign(a,{id:uid()}));q("#dlg").close();save()})}

=z.get("date")||todayISO();if(currencyInfo(a.currency).needsRate){a.exchangeRate=Number(z.get("exchangeRate"));if(!Number.isFinite(a.exchangeRate)||a.exchangeRate<=0){toast("请输入有效汇率");return}}else delete a.exchangeRate;if(old){Object.assign(old,a);if(!currencyInfo(a.currency).needsRate)delete old.exchangeRate}else{a.created=Date.now();a.id=uid();x.expenses.push(a)}q("#dlg").close();save()});let f=q("#form"),rateField=q("#expenseRateField"),rateInput=q("#expenseRate"),rateCurrency=q("#expenseRateCurrency"),lastCurrency=selectedCurrency,syncRate=()=>{let c=f.elements.currency.value,cfg=currencyInfo(c),changed=c!==lastCurrency;rateField.style.display=cfg.needsRate?"":"none";rateInput.disabled=!cfg.needsRate;rateInput.required=cfg.needsRate;rateCurrency.textContent=cfg.label;if(!cfg.needsRate)rateInput.value="";else if(changed)rateInput.value=c==="RMB"?x.rate:"";else if(!rateInput.value&&c==="RMB")rateInput.value=x.rate;lastCurrency=c},upd=()=>{let n=f.querySelectorAll('[name="people"]:checked').length;q("#preview").textContent=n?cash((Number(f.elements.amount.value)||0)/n,f.elements.currency.value)+" 每人 · "+n+" 人分摊":"请选择分摊成员"};f.oninput=upd;f.onchange=()=>{syncRate();upd()};syncRate();upd()}function newTrip(){modal("创建行程",'<div class="field wide"><label>行程名称</label><input name="name" required></div><div class="field"><label>开始日期</label><input name="start" type="date" value="2026-10-25" required></div><div class="field"><label>结束日期</label><input name="end" type="date" value="2026-10-31" required></div><div class="field wide"><label>出行人数（以逗号分隔）</label><input name="people" value="A, B, C, D, E" required></div><div class="field wide"><label>汇率 <small>Exchange Rate</small> · 1 RMB = MYR</label><input name="rate" type="number" min=".0001" step=".0001" value=".65" required></div>',z=>{let a=Object.fromEntries(z),ps=a.people.split(",").map(x=>x.trim()).filter(Boolean);if(a.end<a.start||!ps.length){toast("请检查日期和成员姓名");return}db.trips.push({id:uid(),name:a.name,start:a.start,end function addMember(){let x=t(),name=prompt("请输入新成员的显示姓名：");if(name===null)return;name=name.trim();if(!name){toast("成员姓名不能为空");return}x.personNames=x.personNames||{};x.people.forEach(p=>{if(!Object.prototype.hasOwnProperty.call(x.personNames,p))x.personNames[p]=p});let id;do{id="member-"+uid()}while(x.people.includes(id)||Object.prototype.hasOwnProperty.call(x.personNames,id));x.people.push(id);x.personNames[id]=name;save()}function deleteMember(id){let x=t();if(!confirm("确定要删除这个成员吗？"))return;if(x.expenses.some(e=>e.payer===id||(e.participants||[]).includes(id))){toast("该成员已有账单记录，不能直接删除。");return}x.people=x.people.filter(p=>p!==id);if(x.personNames)delete x.personNames[id];save()}function renamePerson(id){let x=t(),old=personName(id,x),name=prompt("请输入新的显示姓名：",old);if(name===null)return;name=name.trim();if(!name){toast("姓名不能为空");return}x.personNames=x.personNames||{};x.personNames[id]=name;save()}function toast(s){let a=q("#toast");a.textContent=s;a.style.display="block";setTimeout(()=>a.style.display="none",2000)}
document.addEventListener("click",e=>{let a=e.target.closest("[data-tab]");if(a){tab=a.dataset.tab;render();return}a=e.target.closest("[data-act]");if(!a)return;let x=t(),i=a.dataset.id;if(a.dataset.act==="addEvent")eventForm();if(a.dataset.act==="editEvent")eventForm(x.events.find(z=>z.id===i));if(a.dataset.act==="addExpense")expenseForm();if(a.dataset.act==="editExpense")expenseForm(x.expenses.find(z=>z.id===i));if(a.dataset.act==="editPerson")renamePerson(i);if(a.dataset.act==="deleteMember")deleteMember(i);if(a.dataset.act==="addMember")addMember();if(a.dataset.act==="delEvent"&&confirm("确定删除这项行程安排吗？")){x.events=x.events.filter(z=>z.id!==i);save()}if(a.dataset.act==="delExpense"&&confirm("确定删除这笔账单吗？")){x.expenses=x.expenses.filter(z=>z.id!==i);save()}});
q("#trips").onchange=e=>{db.active=e.target.value;tab="itinerary";save()};q("#new").onclick=newTrip;q("#saveRate").onclick=()=>{let n=Number(q("#rate").value);if(n>0){t().rate=n;save();toast("汇率已保存")}};q("#export").onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="Tripmate-行程备份.json";a.click();URL.revokeObjectURL(u)};q("#import").onclick=()=>q("#file").click();q("#file").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.trips)||!x.trips.length)throw 0;if(confirm("导入将替换此浏览器中保存的所有行程。")){db=x;if(!db.trips.some(z=>z.id===db.active))db.active=db.trips[0].id;save()}}catch(z){toast("无法识别此 Tripmate 备份文件")}e.target.value=""};render()})();
</script></body></html>
